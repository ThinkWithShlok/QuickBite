<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin | QuickBite</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</head>
<body data-page="admin">
  <header class="site-header">
    <a class="brand" href="/">Quick<span>Bite</span><small>GOOD FOOD, GOOD MOOD</small></a>
    <nav><a href="/">Menu</a><a href="/orders">My orders</a><a class="active" href="/admin">Admin</a><a class="cart-link" href="/cart">Cart <span id="cart-count">0</span></a></nav>
  </header>
  <main class="admin-page">
    <p class="eyebrow">QuickBite management</p><h1>Admin dashboard</h1>
    <section class="admin-section">
      <div class="section-heading"><div><p class="eyebrow">Menu management</p><h2>Food items</h2></div></div>
      <form id="food-form" class="food-form">
        <label>Name<input name="name" required maxlength="80" placeholder="e.g. Veg Sandwich"></label>
        <label>Description<input name="description" required maxlength="200" placeholder="A short description"></label>
        <label>Price (₹)<input name="price" required type="number" min="1" step="0.01" placeholder="149"></label>
        <label>Category<input name="category" required maxlength="40" placeholder="Snacks"></label>
        <button class="button button-primary">Add food item</button>
      </form>
      <p id="admin-message" class="notice" role="status"></p>
      <div id="admin-food-list" class="admin-list"></div>
    </section>
    <section class="admin-section">
      <div class="section-heading"><div><p class="eyebrow">Incoming orders</p><h2>Orders</h2></div><button id="refresh-orders" class="button button-light">Refresh</button></div>
      <div id="admin-orders-list" class="orders-list"></div>
    </section>
  </main>
  <footer>QuickBite · Made with care, served with a smile.</footer>
</body>
</html>
