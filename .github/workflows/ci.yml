name: QuickBite CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build and validate application
        run: |
          python -m compileall app.py database.py

      - name: Run tests
        run: |
          python -m pytest

      - name: Package application
        run: |
          zip -r quickbite-package.zip . \
            -x ".git/*" \
               ".venv/*" \
               "__pycache__/*" \
               "*.pyc" \
               "quickbite.db"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: quickbite-package
          path: quickbite-package.zip